name: Build and deploy mdBook

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.36
      MDBOOK_SUMMARIZER_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache mdBook tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-summarizer
          key: mdbook-tools-${{ runner.os }}-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_SUMMARIZER_VERSION }}
      - name: Install mdBook and mdbook-summarizer
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version "${MDBOOK_VERSION}" mdbook
          cargo install --locked --version "${MDBOOK_SUMMARIZER_VERSION}" mdbook-summarizer
      - name: Build book
        run: |
          mdbook-summarizer --src src
          mdbook build
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
